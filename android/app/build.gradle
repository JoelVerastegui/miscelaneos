plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

import java.util.Properties

// 1. Localizar el archivo .env en la raíz del proyecto de Flutter
def envFile = rootProject.file("../.env")
def envProperties = new Properties()

// 2. Si el archivo existe, cargar sus valores de manera segura
if (envFile.exists()) {
    envFile.withInputStream { stream -> 
        envProperties.load(stream) 
    }
} else {
    logger.warn(".env file not found at project root!")
}

android {
    namespace = "com.joelverastegui.miscelaneos"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.joelverastegui.miscelaneos"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        
        // 2. Extraer el valor del archivo .env
        def googleMapsApiKey = envProperties.getProperty('GOOGLE_MAPS_API_KEY') ?: ""
        def googleAdmobAppId = envProperties.getProperty('GOOGLE_ADMOB_APP_ID') ?: ""

        // 3. Inyectar en manifestPlaceholders usando la sintaxis moderna de mapas
        manifestPlaceholders.put("GOOGLE_MAPS_API_KEY", googleMapsApiKey)
        manifestPlaceholders.put("GOOGLE_ADMOB_APP_ID", googleAdmobAppId)
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
